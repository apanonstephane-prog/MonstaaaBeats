name: "MONSTAAABEATS — Setup Supabase"

# Déclenché manuellement depuis l'onglet Actions de GitHub
on:
  workflow_dispatch:
    inputs:
      supabase_token:
        description: |
          Personal Access Token Supabase
          → Créer sur https://supabase.com/dashboard/account/tokens
        required: true
        type: string

permissions:
  contents: write   # pour commit + push index.html patché

jobs:
  setup:
    name: "Setup DB + credentials"
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Lancer setup.js
        env:
          SUPABASE_TOKEN: ${{ inputs.supabase_token }}
        run: node setup.js

      - name: Commit index.html avec credentials
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --staged --quiet; then
            echo "index.html inchangé (credentials déjà présents)"
          else
            git commit -m "chore: inject Supabase credentials [ci skip]"
            git push
            echo "✅ index.html commité avec la clé anon Supabase"
          fi
